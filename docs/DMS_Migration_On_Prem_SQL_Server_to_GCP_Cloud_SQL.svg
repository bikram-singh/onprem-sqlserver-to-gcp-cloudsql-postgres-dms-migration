<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B31412"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#FFFFFF"/>

  <!-- ===================== HOME NETWORK ===================== -->
  <rect x="40" y="30" width="1020" height="260" rx="14" fill="#F8F9FA" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="62" y="60" font-size="19" font-weight="700" fill="#202124">🏠 Home Network — Wi-Fi, dynamic public IP</text>

  <!-- strongswan-gw -->
  <rect x="90" y="90" width="430" height="175" rx="10" fill="#FFFFFF" stroke="#4285F4" stroke-width="2.5"/>
  <text x="115" y="123" font-size="17" font-weight="700" fill="#1A73E8">🔐 strongswan-gw</text>
  <text x="115" y="143" font-size="12" fill="#5F6368">Hyper-V VM · Default Switch (NAT)</text>
  <line x1="115" y1="153" x2="495" y2="153" stroke="#E8EAED" stroke-width="1.5"/>
  <text x="115" y="179" font-size="13.5" fill="#3C4043">strongSwan (IPsec, route-based / VTI)</text>
  <text x="115" y="201" font-size="13.5" fill="#3C4043">+ FRR (dynamic BGP)</text>
  <text x="115" y="231" font-size="13.5" font-weight="700" fill="#1A73E8">→ HA VPN tunnels (×2) to GCP</text>
  <text x="115" y="252" font-size="12" fill="#5F6368">172.24.107.2</text>

  <!-- ubuntu-sqlserver -->
  <rect x="580" y="90" width="430" height="175" rx="10" fill="#FFFFFF" stroke="#34A853" stroke-width="2.5"/>
  <text x="605" y="123" font-size="17" font-weight="700" fill="#1E8E3E">🗄️ ubuntu-sqlserver</text>
  <text x="605" y="143" font-size="12" fill="#5F6368">Hyper-V VM · Default Switch (NAT)</text>
  <line x1="605" y1="153" x2="985" y2="153" stroke="#E8EAED" stroke-width="1.5"/>
  <text x="605" y="179" font-size="13.5" fill="#3C4043">SQL Server 2025 on Linux</text>
  <text x="605" y="201" font-size="13.5" fill="#3C4043">5 databases: MyDatabase, LibraryDB,</text>
  <text x="605" y="221" font-size="13.5" fill="#3C4043">HospitalDB, InventoryDB, SchoolDB</text>
  <text x="605" y="252" font-size="12" fill="#5F6368">172.24.100.130</text>

  <!-- shared subnet note -->
  <text x="550" y="284" font-size="12.5" fill="#5F6368" text-anchor="middle" font-style="italic">same NAT'd subnet (172.24.96.0/20) — advertised to GCP via BGP</text>

  <!-- arrow: strongswan-gw down to GCP -->
  <path d="M305,265 L305,334" stroke="#1A73E8" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="322" y="298" font-size="12.5" fill="#1A73E8" font-weight="600">HA VPN — 2 tunnels</text>
  <text x="322" y="314" font-size="12.5" fill="#1A73E8" font-weight="600">+ dynamic BGP</text>

  <!-- ===================== GCP ===================== -->
  <rect x="40" y="340" width="1020" height="185" rx="14" fill="#E8F0FE" stroke="#4285F4" stroke-width="2" stroke-dasharray="8,5"/>
  <g transform="translate(62,350) scale(0.85)">
    <path fill="#4285F4" d="M12.19 2.38a9.344 9.344 0 0 0-9.234 6.893c.053-.02-.055.013 0 0-3.875 2.551-3.922 8.11-.247 10.941l.006-.007-.007.03a6.717 6.717 0 0 0 4.077 1.356h5.173l.03.03h5.192c6.687.053 9.376-8.605 3.835-12.35a9.365 9.365 0 0 0-2.821-4.552l-.043.043.006-.05A9.344 9.344 0 0 0 12.19 2.38zm-.358 4.146c1.244-.04 2.518.368 3.486 1.15a5.186 5.186 0 0 1 1.862 4.078v.518c3.53-.07 3.53 5.262 0 5.193h-5.193l-.008.009v-.04H6.785a2.59 2.59 0 0 1-1.067-.23h.001a2.597 2.597 0 1 1 3.437-3.437l3.013-3.012A6.747 6.747 0 0 0 8.11 8.24c.018-.01.04-.026.054-.023a5.186 5.186 0 0 1 3.67-1.69z"/>
  </g>
  <text x="92" y="368" font-size="19" font-weight="700" fill="#174EA6">Google Cloud Platform — migration-project-111</text>

  <!-- Cloud VPN -->
  <rect x="70" y="392" width="270" height="105" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="2"/>
  <g transform="translate(90,404)">
    <rect x="14.73" y="11.28" width="4.18" height="1.38" fill="#669df6"/>
    <rect x="17.95" y="6.12" width="1.38" height="11.71" fill="#669df6"/>
    <rect x="16.3" y="17.32" width="4.68" height="4.68" rx="0.28" fill="#4285f4"/>
    <rect x="16.3" y="2" width="4.68" height="4.68" rx="0.28" fill="#4285f4"/>
    <rect x="6.98" y="11.28" width="4.28" height="1.38" fill="#669df6"/>
    <rect x="3.03" y="9.63" width="4.68" height="4.68" rx="0.28" fill="#4285f4"/>
    <path d="M13,14.17a2.2,2.2,0,1,1,2.2-2.2A2.19,2.19,0,0,1,13,14.17Zm0-3.57A1.38,1.38,0,1,0,14.33,12,1.37,1.37,0,0,0,13,10.6Z" fill="#4285f4"/>
  </g>
  <text x="120" y="420" font-size="14.5" font-weight="700" fill="#1A73E8">Cloud VPN</text>
  <text x="90" y="440" font-size="13" fill="#3C4043">HA VPN Gateway</text>
  <text x="90" y="461" font-size="11.5" fill="#5F6368">home-vpn-gateway</text>
  <text x="90" y="478" font-size="11.5" fill="#5F6368">2 interfaces · Cloud Router</text>

  <path d="M340,444 L394,444" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <!-- VPC -->
  <rect x="400" y="392" width="200" height="105" rx="8" fill="#FFFFFF" stroke="#5F6368" stroke-width="2"/>
  <g transform="translate(420,404)">
    <rect x="16" y="2" width="6" height="6" fill="#aecbfa"/>
    <rect x="19" y="2" width="3" height="6" fill="#669df6"/>
    <rect x="16" y="16" width="6" height="6" fill="#aecbfa"/>
    <rect x="19" y="16" width="3" height="6" fill="#669df6"/>
    <rect x="2" y="2" width="6" height="6" fill="#aecbfa"/>
    <rect x="5" y="2" width="3" height="6" fill="#669df6"/>
    <rect x="2" y="16" width="6" height="6" fill="#aecbfa"/>
    <rect x="5" y="16" width="3" height="6" fill="#669df6"/>
    <rect x="8" y="4" width="8" height="2" fill="#669df6"/>
    <rect x="8" y="18" width="8" height="2" fill="#669df6"/>
    <rect x="18" y="8" width="2" height="8" fill="#669df6"/>
    <rect x="4" y="8" width="2" height="8" fill="#669df6"/>
    <rect x="4" y="8" width="2" height="2" fill="#4285f4"/>
    <rect x="18" y="8" width="2" height="2" fill="#4285f4"/>
    <rect x="8" y="4" width="2" height="2" fill="#4285f4"/>
    <rect x="8" y="18" width="2" height="2" fill="#4285f4"/>
  </g>
  <text x="450" y="420" font-size="14.5" font-weight="700" fill="#3C4043">VPC</text>
  <text x="420" y="440" font-size="13" fill="#3C4043">my-vpc</text>
  <text x="420" y="461" font-size="11.5" fill="#5F6368">us-central1</text>

  <path d="M600,444 L654,444" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Cloud SQL -->
  <rect x="660" y="392" width="370" height="105" rx="8" fill="#FFFFFF" stroke="#336791" stroke-width="2"/>
  <text x="680" y="420" font-size="14.5" font-weight="700" fill="#336791">🐘 Cloud SQL for PostgreSQL</text>
  <text x="680" y="440" font-size="13" fill="#3C4043">my-postgres</text>
  <text x="680" y="461" font-size="11.5" fill="#5F6368">Private IP only · Private Service Connect</text>
  <text x="680" y="478" font-size="11.5" fill="#5F6368">10.0.0.2</text>

  <!-- arrow: GCP down to DMS -->
  <path d="M550,525 L550,558" stroke="#B31412" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="566" y="546" font-size="12" fill="#B31412" font-weight="600">via private connectivity</text>

  <!-- ===================== DMS ===================== -->
  <rect x="40" y="560" width="1020" height="205" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="2" stroke-dasharray="8,5"/>
  <g transform="translate(62,570)">
    <polygon points="4.69 7.7 9.38 4.99 9.38 2.27 2.25 6.38 2.64 6.86 4.26 7.74 4.69 7.7" style="fill:#4285f4"/>
    <path d="M9.38,17.36,2.25,13.25V10.66l7.13,4.12Zm0,1.77L2.25,15v2.6l7.13,4.12Zm0-8.71L4.69,7.7,2.25,6.38v2.5L9.38,13" style="fill:#aecbfa;fill-rule:evenodd"/>
    <path d="M9.38,21.73l7-4V15.1l-7,4m0-4.35,7-4h2.08v2.33H16.78l-7.4,4.29Zm0-1.77L16.79,8.7h2.44v1.36l2.51-2.51-2.51-2.5V6.37H16.36l-1.23.72-1.06.61L11.35,9.27l-2,1.15Z" style="fill:#669df6;fill-rule:evenodd"/>
    <polygon points="9.38 4.99 12.54 6.82 14.9 5.46 9.38 2.27 9.38 4.99" style="fill:#669df6;fill-rule:evenodd"/>
  </g>
  <text x="92" y="588" font-size="19" font-weight="700" fill="#B31412">Database Migration Service — per database (MyDatabase, HospitalDB, InventoryDB, LibraryDB)</text>

  <!-- Step 1 -->
  <rect x="60" y="610" width="205" height="112" rx="8" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="162" y="642" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">1. Private</text>
  <text x="162" y="660" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">Connectivity</text>
  <text x="162" y="687" font-size="11" fill="#5F6368" text-anchor="middle">VPC peering</text>
  <text x="162" y="703" font-size="11" fill="#5F6368" text-anchor="middle">10.250.0.0/29</text>

  <path d="M265,666 L295,666" stroke="#B31412" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Step 2 -->
  <rect x="300" y="610" width="205" height="112" rx="8" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="402" y="642" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">2. Connection</text>
  <text x="402" y="660" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">Profiles</text>
  <text x="402" y="687" font-size="11" fill="#5F6368" text-anchor="middle">source (SQL Server) +</text>
  <text x="402" y="703" font-size="11" fill="#5F6368" text-anchor="middle">destination (Postgres)</text>

  <path d="M505,666 L535,666" stroke="#B31412" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Step 3 -->
  <rect x="540" y="610" width="205" height="112" rx="8" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="642" y="642" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">3. Conversion</text>
  <text x="642" y="660" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">Workspace</text>
  <text x="642" y="687" font-size="11" fill="#5F6368" text-anchor="middle">schema translation</text>
  <text x="642" y="703" font-size="11" fill="#5F6368" text-anchor="middle">T-SQL → PostgreSQL</text>

  <path d="M745,666 L775,666" stroke="#B31412" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Step 4 -->
  <rect x="780" y="610" width="205" height="112" rx="8" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="882" y="642" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">4. Migration</text>
  <text x="882" y="660" font-size="13.5" font-weight="700" fill="#B31412" text-anchor="middle">Jobs</text>
  <text x="882" y="687" font-size="11" fill="#5F6368" text-anchor="middle">one-time, full load</text>
  <text x="882" y="703" font-size="11" fill="#5F6368" text-anchor="middle">row counts verified</text>

  <!-- footer -->
  <text x="1060" y="790" font-size="10" fill="#9AA0A6" text-anchor="end">onprem-sqlserver-to-gcp-cloudsql-postgres-dms-migration</text>
</svg>
